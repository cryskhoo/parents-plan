name: Fetch fund data
on:
  schedule:
    - cron: "17 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        timeout-minutes: 20
        run: python tracker/fetch.py 2>&1 | tee fetch.log
      - uses: actions/upload-artifact@v4
        with:
          name: fetch-log
          path: fetch.log
      - name: Broker logos (clearbit, only if missing)
        run: |
          mkdir -p tracker/logos
          for pair in ibkr:interactivebrokers.com moomoo:moomoo.com tiger:tigerbrokers.com.sg syfe:syfe.com fsmone:fsmone.com saxo:home.saxo poems:poems.com.sg dbs:dbs.com.sg endowus:endowus.com; do
            n=${pair%%:*}; dom=${pair#*:}
            [ -s tracker/logos/$n.png ] || curl -sL -m 20 -o tracker/logos/$n.png "https://www.google.com/s2/favicons?domain=$dom&sz=128" || true
            file tracker/logos/$n.png | grep -qi image || rm -f tracker/logos/$n.png
          done
          ls -la tracker/logos || true
      - name: Commit data
        run: |
          git config user.name "fund-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tracker/data.js tracker/logos || true
          git diff --cached --quiet || git commit -m "Update fund data $(date -u +%F)"
          git pull --rebase -X theirs origin main || (git checkout --theirs tracker/data.js && git add tracker/data.js && GIT_EDITOR=true git rebase --continue)
          git push
